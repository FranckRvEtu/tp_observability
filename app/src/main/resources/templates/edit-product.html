<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditer un produit - Observabilité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #212529 !important;
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-weight: bold;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto 3rem;
        }
        .form-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border-radius: 0.5rem;
            border: 1px solid #ddd;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
        }
        .btn-submit:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-cancel {
            background-color: #6c757d;
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
            color: white;
        }
        .alert {
            border-radius: 10px;
        }
        footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            padding: 2rem 0;
            margin-top: 3rem;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up"></i> Observabilité
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-house"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/products">
                            <i class="bi bi-box"></i> Produits
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stats">
                            <i class="bi bi-graph-up"></i> Statistiques
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container-fluid">
            <h1><i class="bi bi-pencil-square"></i> Éditer un produit</h1>
            <p class="mb-0">Modifiez les informations du produit ci-dessous</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container-fluid">
        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
            <i class="bi bi-exclamation-circle"></i>
            <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Success Alert -->
        <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
            <i class="bi bi-check-circle"></i>
            <span id="successMessage">Produit modifié avec succès!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <form id="editProductForm">
                <input type="hidden" id="productId" th:value="${product?.id}" />

                <div class="mb-3">
                    <label for="name" class="form-label">
                        <i class="bi bi-tag"></i> Nom du produit
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        th:value="${product?.name}"
                        placeholder="Ex: Laptop Pro 15"
                        required
                    >
                    <small class="text-muted">Le nom du produit (requis)</small>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">
                        <i class="bi bi-currency-euro"></i> Prix
                    </label>
                    <div class="input-group">
                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            name="price"
                            th:value="${product?.price}"
                            placeholder="0.00"
                            step="0.01"
                            min="0"
                            required
                        >
                        <span class="input-group-text">€</span>
                    </div>
                    <small class="text-muted">Le prix du produit (requis)</small>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">
                        <i class="bi bi-calendar"></i> Date
                    </label>
                    <input
                        type="date"
                        class="form-control"
                        id="date"
                        name="date"
                        th:value="${product?.date}"
                        required
                    >
                    <small class="text-muted">La date du produit (requis)</small>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-check-circle"></i> Enregistrer les modifications
                    </button>
                </div>

                <div class="mb-0">
                    <a href="/products" class="btn-cancel">
                        <i class="bi bi-arrow-left"></i> Retour à la liste
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Vérifier que l'utilisateur est connecté
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login';
        }

        document.getElementById('editProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const productId = document.getElementById('productId').value;
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const date = document.getElementById('date').value;

            // Validation
            if (!name || name.trim() === '') {
                showError('Le nom du produit est requis');
                return;
            }

            if (price < 0) {
                showError('Le prix doit être positif');
                return;
            }

            if (!date) {
                showError('La date est requise');
                return;
            }

            const productData = {
                id: productId,
                name: name.trim(),
                price: price,
                date: date
            };

            // Afficher le spinner
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Modification en cours...';
            submitBtn.disabled = true;

            fetch('/product/update', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                return response.text().then(text => {
                    throw new Error(text || 'Erreur lors de la modification du produit');
                });
            })
            .then(data => {
                showSuccess('Produit modifié avec succès! Redirection...');
                setTimeout(() => {
                    window.location.href = '/products';
                }, 2000);
            })
            .catch(error => {
                console.error('Error:', error);
                showError(error.message);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });

        function showError(message) {
            const alertDiv = document.getElementById('errorAlert');
            const messageSpan = document.getElementById('errorMessage');
            messageSpan.textContent = message;
            alertDiv.classList.remove('d-none');
            scrollToAlert();
        }

        function showSuccess(message) {
            const alertDiv = document.getElementById('successAlert');
            const messageSpan = document.getElementById('successMessage');
            messageSpan.textContent = message;
            alertDiv.classList.remove('d-none');
            scrollToAlert();
        }

        function scrollToAlert() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            scrollToAlert();
        }
    </script>
    <script type="module" src="/js/tracing.js"></script>
</body>
</html>
