<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Observabilité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .signup-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 2rem;
        }
        .signup-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #667eea;
            font-weight: bold;
        }
        .form-control {
            border-radius: 0.5rem;
            border: 1px solid #ddd;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-signup:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .back-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Retour</a>

    <div class="signup-container">
        <h2><i class="bi bi-person-plus"></i> S'inscrire</h2>

        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
            <i class="bi bi-exclamation-circle"></i>
            <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form id="signupForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstname" class="form-label"><i class="bi bi-person"></i> Prénom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="firstname"
                        name="firstname"
                        placeholder="Votre prénom"
                        required
                    >
                </div>
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label"><i class="bi bi-person-fill"></i> Nom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Votre nom"
                        required
                    >
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Votre adresse email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="age" class="form-label"><i class="bi bi-calendar"></i> Âge</label>
                <input
                    type="number"
                    class="form-control"
                    id="age"
                    name="age"
                    placeholder="Votre âge"
                    min="13"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label"><i class="bi bi-lock"></i> Mot de passe</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 caractères"
                    minlength="6"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label"><i class="bi bi-lock-fill"></i> Confirmer le mot de passe</label>
                <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirmez votre mot de passe"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="btn-signup">
                <i class="bi bi-person-check"></i> S'inscrire
            </button>
        </form>

        <div class="login-link">
            Vous avez déjà un compte? <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Se connecter</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const firstname = document.getElementById('firstname').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const age = parseInt(document.getElementById('age').value);
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Vérification des mots de passe
            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas');
                return;
            }

            if (password.length < 6) {
                showError('Le mot de passe doit contenir au moins 6 caractères');
                return;
            }

            const userData = {
                firstname: firstname,
                name: name,
                email: email,
                age: age,
                password: password
            };

            fetch('/user/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                return response.text().then(text => {
                    throw new Error(text || 'Erreur lors de l\'inscription');
                });
            })
            .then(data => {
                // Enregistrer l'utilisateur (avec son id) dans le localStorage
                Auth.setUser(data);
                alert('Inscription réussie! Bienvenue ' + data.firstname);
                window.location.href = '/products';
            })
            .catch(error => {
                console.error('Error:', error);
                showError(error.message);
            });
        });

        function showError(message) {
            const alertDiv = document.getElementById('errorAlert');
            const messageSpan = document.getElementById('errorMessage');
            messageSpan.textContent = message;
            alertDiv.classList.remove('d-none');
        }
    </script>
</body>
</html>
