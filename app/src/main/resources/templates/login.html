<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Observabilité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            position: relative;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 1.25rem;
            color: #667eea;
            font-weight: bold;
        }
        .form-control {
            border-radius: 0.5rem;
            border: 1px solid #ddd;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.18);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: bold;
            width: 100%;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.25); }
        .back-link { position: absolute; left: 1rem; top: 1rem; color: #667eea; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #4f5bd5; }
        .signup-link { text-align: center; margin-top: 1rem; }
        .alert { border-radius: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Retour</a>

        <h2><i class="bi bi-box-arrow-in-right"></i> Connexion</h2>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Votre adresse email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label"><i class="bi bi-lock"></i> Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Votre mot de passe" required>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-unlock"></i> Se connecter
            </button>
        </form>

        <div class="signup-link">
            Pas encore de compte? <a href="/signup"><i class="bi bi-person-plus"></i> S'inscrire</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset error
            const err = document.getElementById('errorAlert');
            err.classList.add('d-none');
            err.textContent = '';

            fetch('/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(response => {
                if (response.ok) return response.json();
                return response.text().then(text => { throw new Error(text || 'Identifiants incorrects'); });
            })
            .then(data => {
                // Enregistrer l'utilisateur (avec son id) dans le localStorage
                Auth.setUser(data);
                console.log('Connexion réussie. UserId:', data.id);
                window.location.href = '/products';
            })
            .catch(error => {
                err.textContent = error.message || 'Erreur lors de la connexion';
                err.classList.remove('d-none');
            });
        });
    </script>
</body>
</html>
